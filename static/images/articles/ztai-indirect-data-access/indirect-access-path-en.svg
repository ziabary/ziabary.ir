<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Read access is blocked, but information can still get out</title><desc id="desc">Code-change authority combined with output access can recreate access to confidential data.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#128b91"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#f8fbff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#153d68">
<text x="600" y="48" font-size="30" font-weight="bold" text-anchor="middle" fill="#153d68">Read access is blocked; an indirect path remains</text>
<text x="600" y="82" font-size="20" font-weight="normal" text-anchor="middle" fill="#153d68">Two permissions can combine: changing the program and receiving its results</text>
<rect x="340" y="122" width="540" height="350" rx="12" fill="#e9f4f8" stroke="#82b3c9" stroke-width="2" stroke-dasharray="8 5"/>
<text x="610" y="154" font-size="18" font-weight="bold" text-anchor="middle" fill="#153d68">CONFIDENTIAL DATA BOUNDARY</text>
<rect x="470" y="182" width="270" height="100" rx="12" fill="#fff" stroke="#b8cedf" stroke-width="2" stroke-dasharray=""/><text x="605.0" y="214" font-size="21" font-weight="bold" text-anchor="middle" fill="#153d68">Sensitive data</text><text x="605.0" y="242" font-size="17" font-weight="normal" text-anchor="middle" fill="#153d68">Machine-readable input</text>
<rect x="40" y="340" width="230" height="100" rx="12" fill="#fff" stroke="#b8cedf" stroke-width="2" stroke-dasharray=""/><text x="155.0" y="372" font-size="21" font-weight="bold" text-anchor="middle" fill="#153d68">Developer</text><text x="155.0" y="400" font-size="17" font-weight="normal" text-anchor="middle" fill="#153d68">Can change code</text>
<rect x="385" y="340" width="245" height="100" rx="12" fill="#fff" stroke="#b8cedf" stroke-width="2" stroke-dasharray=""/><text x="507.5" y="372" font-size="21" font-weight="bold" text-anchor="middle" fill="#153d68">Authorized processing</text><text x="507.5" y="400" font-size="17" font-weight="normal" text-anchor="middle" fill="#153d68">Behavior can be changed</text>
<rect x="700" y="340" width="230" height="100" rx="12" fill="#fff" stroke="#b8cedf" stroke-width="2" stroke-dasharray=""/><text x="815.0" y="372" font-size="21" font-weight="bold" text-anchor="middle" fill="#153d68">Report or file</text><text x="815.0" y="400" font-size="17" font-weight="normal" text-anchor="middle" fill="#153d68">May carry raw data</text>
<rect x="990" y="340" width="180" height="100" rx="12" fill="#fff" stroke="#b8cedf" stroke-width="2" stroke-dasharray=""/><text x="1080.0" y="372" font-size="21" font-weight="bold" text-anchor="middle" fill="#153d68">Recipient</text><text x="1080.0" y="400" font-size="17" font-weight="normal" text-anchor="middle" fill="#153d68">Same developer</text>
<path d="M270 390L385 390" fill="none" stroke="#128b91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M630 390L700 390" fill="none" stroke="#128b91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M930 390L990 390" fill="none" stroke="#128b91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M550 282L550 340" fill="none" stroke="#128b91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M155 340V230H470" fill="none" stroke="#c9841a" stroke-width="3" stroke-dasharray="8 5"/>
<text x="290" y="212" font-size="18" font-weight="bold" text-anchor="middle" fill="#986014">Direct viewing: BLOCKED</text>
<text x="600" y="505" font-size="22" font-weight="bold" text-anchor="middle" fill="#153d68">Removing read permission does not make unrestricted code and output access safe.</text>
</g></svg>