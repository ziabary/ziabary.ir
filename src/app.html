<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f6f2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/fonts/fontawesome/v6.2.0/all.min.css" />
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
  <script>
    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
    window.gtag('js', new Date());
    window.gtag('config', 'G-67799BZ3DC');

    function loadGoogleAnalytics() {
      if (document.querySelector('script[data-google-analytics]')) return;
      const script = document.createElement('script');
      script.async = true;
      script.dataset.googleAnalytics = 'true';
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-67799BZ3DC';
      document.head.appendChild(script);
    }

    window.addEventListener('load', () => {
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(loadGoogleAnalytics, { timeout: 3000 });
      } else {
        window.setTimeout(loadGoogleAnalytics, 0);
      }
    }, { once: true });
  </script>
</body>

</html>
